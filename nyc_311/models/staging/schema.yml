version: 2

models:
  - name: stg_complaints
    description: >
      Staged NYC 311 service requests. Selects from the raw landing table,
      renames columns to snake_case, casts date strings to timestamps, and
      converts coordinate strings to floats. One row per service request.

    columns:
      - name: unique_key
        description: >
          Unique identifier assigned by the city to each 311 service request.
          Used to deduplicate records and join across datasets.
        tests:
          - unique
          - not_null

      - name: created_at
        description: >
          Timestamp when the service request was submitted by the resident.
          Sourced from CREATED_DATE and cast from the raw string format
          MM/DD/YYYY HH12:MI:SS AM.
        tests:
          # 4 records have an unparseable date format in the source data;
          # these produce NULL after TO_TIMESTAMP. Warn rather than block the pipeline.
          - not_null:
              config:
                severity: warn

      - name: closed_at
        description: >
          Timestamp when the service request was resolved and closed.
          NULL when the request is still open or in progress.

      - name: agency
        description: >
          Short acronym of the city agency responsible for handling the
          request (e.g. NYPD, DEP, DOT, DSNY).

      - name: agency_name
        description: >
          Full name of the city agency responsible for handling the request
          (e.g. New York City Police Department).
        tests:
          # 5 records are missing an agency name in the source data;
          # an acceptable threshold — warn rather than block the pipeline.
          - not_null:
              config:
                severity: warn

      - name: complaint_type
        description: >
          Top-level category of the complaint as defined by the city
          (e.g. Noise - Residential, HEAT/HOT WATER, Illegal Parking).
          Sourced from the raw column PROBLEM_(FORMERLY_COMPLAINT_TYPE).

      - name: descriptor
        description: >
          Sub-category providing additional detail within the complaint type
          (e.g. Loud Music/Party, No Heat, Blocking Hydrant).
          Sourced from the raw column PROBLEM_DETAIL_(FORMERLY_DESCRIPTOR).

      - name: location_type
        description: >
          Type of location where the incident occurred
          (e.g. Residential Building/House, Street/Sidewalk, Store/Commercial).

      - name: incident_zip
        description: >
          ZIP code of the location where the incident was reported.
          Kept as a string to preserve any leading zeros (e.g. 07030).

      - name: borough
        description: >
          NYC borough where the incident occurred: MANHATTAN, BROOKLYN,
          QUEENS, BRONX, or STATEN ISLAND. Unspecified requests may appear
          as UNKNOWN.
        tests:
          # Some complaints span multiple boroughs or are citywide and have no
          # single borough assigned. Warn rather than block the pipeline.
          - not_null:
              config:
                severity: warn

      - name: latitude
        description: >
          WGS-84 latitude of the incident location. NULL for requests where
          no geographic coordinates were captured.

      - name: longitude
        description: >
          WGS-84 longitude of the incident location. NULL for requests where
          no geographic coordinates were captured.

      - name: status
        description: >
          Current status of the service request lifecycle.
        tests:
          - accepted_values:
              values: ['Open', 'Closed', 'Pending', 'In Progress', 'Assigned', 'Started', 'Unspecified']
